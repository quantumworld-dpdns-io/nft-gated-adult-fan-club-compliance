name: Mobile E2E Tests

on:
  pull_request:
    types: [labeled]
    branches: [main]
  push:
    branches: [main]
    paths:
      - mobile/**
      - frontend/**
      - tests/mobile/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  APPIUM_VERSION: '2.5.0'

jobs:
  android-e2e:
    name: Android E2E Tests
    if: github.event.label.name == 'e2e-mobile' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [34]
        target: [google_apis]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Appium
        run: |
          npm install -g appium@${{ env.APPIUM_VERSION }}
          appium driver install uiautomator2

      - name: Start Android Emulator
        uses: reactiveguy/android-emulator@v1
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          avd-name: Pixel_6_Pro_API_${{ matrix.api-level }}
          heap-size: 512m
          ram-size: 2048m
        continue-on-error: true

      - name: Wait for emulator
        run: |
          adb wait-for-device
          adb shell settings put global window_animation_scale 0.0
          adb shell settings put global transition_animation_scale 0.0
          adb shell settings put global animator_duration_scale 0.0
          echo "Emulator ready"

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build React Native app
        run: |
          cd frontend
          npm run build:android || echo "Using fallback: building APK"
          cd android && ./gradlew assembleDebug || echo "Build artifacts may vary"
        continue-on-error: true

      - name: Install APK on emulator
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            adb install "$APK_PATH"
          else
            echo "No APK found, using app bundle if available"
          fi

      - name: Run Appium tests
        run: |
          appium --log-level info --log appium.log &
          APPIUM_PID=$!
          sleep 5
          cd tests/mobile
          npx wdio run wdio.android.conf.ts || true
          kill $APPIUM_PID 2>/dev/null || true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: tests/mobile/screenshots/
          if-no-files-found: ignore

      - name: Upload Appium logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-appium-logs
          path: appium.log
          if-no-files-found: ignore

  ios-e2e:
    name: iOS E2E Tests
    if: github.event.label.name == 'e2e-mobile' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-14
    strategy:
      matrix:
        ios-version: ['17.2']
        device: ['iPhone 15 Pro']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Appium
        run: |
          npm install -g appium@${{ env.APPIUM_VERSION }}
          appium driver install xcuitest

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build iOS app
        run: |
          cd frontend/ios
          xcodebuild -workspace NFTFanclub.xcworkspace \
            -scheme NFTFanclub \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build || true

      - name: Start iOS simulator
        run: |
          SIMULATOR_UDID=$(xcrun simctl create test-device \
            "${{ matrix.device }}" \
            com.apple.CoreSimulator.SimRuntime.iOS-${{ matrix.ios-version }})
          xcrun simctl boot $SIMULATOR_UDID
          xcrun simctl install $SIMULATOR_UDID \
            $(find frontend/ios/Build -name "*.app" -type d | head -1) || true
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> $GITHUB_ENV

      - name: Run Appium tests
        run: |
          appium --log-level info --log appium.log &
          APPIUM_PID=$!
          sleep 5
          cd tests/mobile
          npx wdio run wdio.ios.conf.ts || true
          kill $APPIUM_PID 2>/dev/null || true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: tests/mobile/screenshots/
          if-no-files-found: ignore

      - name: Upload Appium logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-appium-logs
          path: appium.log
          if-no-files-found: ignore
