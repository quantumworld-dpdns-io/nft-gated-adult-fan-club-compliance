apiVersion: v1
kind: Service
metadata:
  name: nft-fanclub-frontend
  namespace: nft-fanclub
  labels:
    app.kubernetes.io/name: nft-fanclub-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nft-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app.kubernetes.io/name: nft-fanclub-frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nft-fanclub-frontend
  namespace: nft-fanclub
  labels:
    app.kubernetes.io/name: nft-fanclub-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nft-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nft-fanclub-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nft-fanclub-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: nft-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      containers:
        - name: frontend
          image: ghcr.io/quantumworld-dpdns-io/nft-fanclub-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: nft-fanclub-config
            - secretRef:
                name: nft-fanclub-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nft-fanclub-frontend-hpa
  namespace: nft-fanclub
  labels:
    app.kubernetes.io/name: nft-fanclub-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nft-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nft-fanclub-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
