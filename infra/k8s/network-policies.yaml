apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: nft-fanclub
  labels:
    app.kubernetes.io/name: nft-fanclub-network-policies
    app.kubernetes.io/part-of: nft-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: nft-fanclub
  labels:
    app.kubernetes.io/name: nft-fanclub-network-policies
    app.kubernetes.io/part-of: nft-platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: nft-fanclub
  labels:
    app.kubernetes.io/name: nft-fanclub-network-policies
    app.kubernetes.io/part-of: nft-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - port: 8000
          protocol: TCP

---
