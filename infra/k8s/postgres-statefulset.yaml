apiVersion: v1
kind: Service
metadata:
  name: nft-fanclub-postgres
  namespace: nft-fanclub
  labels:
    app.kubernetes.io/name: nft-fanclub-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: nft-platform
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: nft-fanclub-postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nft-fanclub-postgres
  namespace: nft-fanclub
  labels:
    app.kubernetes.io/name: nft-fanclub-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: nft-platform
spec:
  serviceName: nft-fanclub-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nft-fanclub-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nft-fanclub-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: nft-platform
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: nft_fanclub
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nft-fanclub-secrets
                  key: database-user
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nft-fanclub-secrets
                  key: database-password
                  optional: true
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: nft-fanclub-config
                  key: DB_NAME
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: nft-fanclub-postgres
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
