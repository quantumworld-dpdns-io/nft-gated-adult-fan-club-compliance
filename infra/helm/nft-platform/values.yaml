# Default values for nft-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: ghcr.io/quantumworld-dpdns-io
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

backend:
  name: backend
  port: 8000
  image:
    repository: ghcr.io/quantumworld-dpdns-io/nft-fanclub-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  config:
    environment: production
    logLevel: info
    apiUrl: ""
    frontendUrl: ""
    corsOrigins: ""
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - "{{ include \"nft-platform.fullname\" . }}-backend"
            topologyKey: kubernetes.io/hostname
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

frontend:
  name: frontend
  port: 80
  image:
    repository: ghcr.io/quantumworld-dpdns-io/nft-fanclub-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /health
      initialDelaySeconds: 3
      periodSeconds: 5
      failureThreshold: 30
  securityContext:
    runAsUser: 101
    runAsGroup: 101
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

postgres:
  name: postgres
  port: 5432
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  storageSize: 10Gi
  storageClass: standard
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

redis:
  name: redis
  port: 6379
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  storageSize: 5Gi
  storageClass: standard
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 999
    runAsGroup: 999

ingress:
  enabled: true
  className: nginx
  host: nft-fanclub.example.com
  apiHost: api.nft-fanclub.example.com
  tls: true
  letsEncryptEmail: admin@example.com
  clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  cors:
    enabled: true
    allowMethods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    allowHeaders: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key"
    allowCredentials: true
    maxAge: 86400
  rateLimiting:
    rps: 50
    rpm: 1000
    connections: 100
    burstMultiplier: 5
  modsecurity:
    enabled: true
    owaspCoreRules: true
    snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecResponseBodyAccess On
      SecResponseBodyMimeType text/plain text/html text/xml application/json
      SecDefaultAction "phase:1,log,auditlog,pass"
      SecDefaultAction "phase:2,log,auditlog,pass"
  securityHeaders:
    xFrameOptions: DENY
    xContentTypeOptions: nosniff
    xXssProtection: "1; mode=block"
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
    strictTransportSecurity: "max-age=31536000; includeSubDomains; preload"

tetragon:
  enabled: true
  mode: observation
  namespace: nft-fanclub

monitoring:
  enabled: true
  prometheus:
    enabled: true
    namespace: monitoring
    releaseName: prometheus
  serviceMonitor:
    interval: 15s
    scrapeTimeout: 10s
  alertRules:
    enabled: true
    backendDown:
      severity: critical
      for: 1m
    highErrorRate:
      severity: warning
      threshold: 0.05
      for: 5m
    highLatency:
      severity: warning
      threshold: 2
      for: 5m

global:
  environment: staging
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: standard
  monitoringNamespace: monitoring
  labels:
    environment: staging
    team: platform
