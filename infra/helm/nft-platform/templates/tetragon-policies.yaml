  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/usr/bin/xmrig"
                - "/usr/local/bin/xmrig"
                - "/opt/xmrig/xmrig"
                - "/usr/bin/cpuminer"
                - "/usr/local/bin/cpuminer"
                - "/usr/bin/ethminer"
                - "/usr/local/bin/ethminer"
                - "/usr/bin/t-rex"
                - "/usr/local/bin/t-rex"
                - "/usr/bin/nbminer"
                - "/usr/local/bin/nbminer"
                - "/usr/bin/lolminer"
                - "/usr/local/bin/lolminer"
                - "/usr/bin/teamredminer"
                - "/usr/local/bin/teamredminer"
                - "/usr/bin/phoenixminer"
                - "/usr/local/bin/phoenixminer"
                - "/usr/bin/gminer"
                - "/usr/local/bin/gminer"
          matchActions:
            - action: Sigkill
              argError: 0
              arg: 0
      matchNamespaces:
        - namespace: {{ .Values.tetragon.namespace | default .Release.Namespace }}
          operator: In
          values:
            - "{{ .Values.tetragon.namespace | default .Release.Namespace }}"

---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: {{ include "nft-platform.fullname" . }}-detect-netcat-socat
  labels:
    {{- include "nft-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: security
spec:
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/usr/bin/nc"
                - "/usr/bin/nc.traditional"
                - "/usr/bin/ncat"
                - "/usr/bin/socat"
                - "/bin/nc"
                - "/bin/nc.traditional"
          matchActions:
            - action: Sigkill
              argError: 0
              arg: 0
      matchNamespaces:
        - namespace: {{ .Values.tetragon.namespace | default .Release.Namespace }}
          operator: In
          values:
            - "{{ .Values.tetragon.namespace | default .Release.Namespace }}"
{{- end }}
