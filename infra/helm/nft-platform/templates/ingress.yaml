{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nft-platform.fullname" . }}-ingress
  labels:
    {{- include "nft-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    cert-manager.io/acme-challenge-type: http01
    {{- end }}
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.annotations.sslRedirect | default "true" | quote }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ .Values.ingress.annotations.forceSslRedirect | default "true" | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.annotations.proxyBodySize | default "10m" }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.annotations.proxyReadTimeout | default "60" }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.annotations.proxySendTimeout | default "60" }}
    {{- if .Values.ingress.cors.enabled }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: {{ .Values.ingress.cors.allowMethods | quote }}
    nginx.ingress.kubernetes.io/cors-allow-headers: {{ .Values.ingress.cors.allowHeaders | quote }}
    nginx.ingress.kubernetes.io/cors-allow-credentials: {{ .Values.ingress.cors.allowCredentials | quote }}
    nginx.ingress.kubernetes.io/cors-allow-origin: {{ printf "https://%s" .Values.ingress.host | quote }}
    nginx.ingress.kubernetes.io/cors-max-age: {{ .Values.ingress.cors.maxAge | quote }}
    {{- end }}
    {{- if .Values.ingress.rateLimiting }}
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.rateLimiting.rps | quote }}
    nginx.ingress.kubernetes.io/limit-rpm: {{ .Values.ingress.rateLimiting.rpm | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .Values.ingress.rateLimiting.connections | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .Values.ingress.rateLimiting.burstMultiplier | quote }}
    {{- end }}
    {{- if .Values.ingress.modsecurity.enabled }}
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: {{ .Values.ingress.modsecurity.owaspCoreRules | quote }}
    nginx.ingress.kubernetes.io/modsecurity-snippet: {{ .Values.ingress.modsecurity.snippet | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: {{ .Values.ingress.securityHeaders.xFrameOptions }}";
      more_set_headers "X-Content-Type-Options: {{ .Values.ingress.securityHeaders.xContentTypeOptions }}";
      more_set_headers "X-XSS-Protection: {{ .Values.ingress.securityHeaders.xXssProtection }}";
      more_set_headers "Referrer-Policy: {{ .Values.ingress.securityHeaders.referrerPolicy }}";
      more_set_headers "Permissions-Policy: {{ .Values.ingress.securityHeaders.permissionsPolicy }}";
      more_set_headers "Strict-Transport-Security: {{ .Values.ingress.securityHeaders.strictTransportSecurity }}";
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"
spec:
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.apiHost }}
        - {{ .Values.ingress.host }}
      secretName: {{ include "nft-platform.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nft-platform.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nft-platform.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
