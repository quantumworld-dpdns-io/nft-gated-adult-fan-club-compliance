apiVersion: v1
kind: Service
metadata:
  name: {{ include "nft-platform.fullname" . }}-backend
  labels:
    {{- include "nft-platform.backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
  selector:
    {{- include "nft-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nft-platform.fullname" . }}-frontend
  labels:
    {{- include "nft-platform.frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      protocol: TCP
  selector:
    {{- include "nft-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nft-platform.fullname" . }}-postgres
  labels:
    {{- include "nft-platform.postgres.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
  selector:
    {{- include "nft-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nft-platform.fullname" . }}-redis
  labels:
    {{- include "nft-platform.redis.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
      protocol: TCP
  selector:
    {{- include "nft-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
