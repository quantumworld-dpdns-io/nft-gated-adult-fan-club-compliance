version: "3.9"

services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nft_fanclub_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@test-postgres:5432/nft_fanclub_test
      REDIS_URL: redis://test-redis:6379/0
      ENVIRONMENT: test
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: >
      sh -c "cd /app && pytest -v --cov=app --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml"

  zap-test:
    image: zaproxy/zap-stable
    ports:
      - "8081:8080"
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=change-me
    profiles:
      - security
